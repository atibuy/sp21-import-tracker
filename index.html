function recalcNim() {
  const sb = parseFloat(document.getElementById('smallBoxes').value) || 0;
  const lb = parseFloat(document.getElementById('largeBoxes').value) || 0;
  const sr = parseFloat(document.getElementById('smallRate').value) || 0;
  const lr = parseFloat(document.getElementById('largeRate').value) || 0;
  const total = sb * sr + lb * lr;
  document.getElementById('nimCost').value = +total.toFixed(2);
  const hint = document.getElementById('nim-hint');
  if (hint) hint.textContent = `${fmtNum(sb)} × ${fmtBaht(sr)} + ${fmtNum(lb)} × ${fmtBaht(lr)} = ${fmtBaht(total)} ฿ (แก้ไขได้)`;
}
function saveStepE() {
  const smallBoxes = parseInt(document.getElementById('smallBoxes').value, 10) || 0;
  const largeBoxes = parseInt(document.getElementById('largeBoxes').value, 10) || 0;
  const smallRate = parseFloat(document.getElementById('smallRate').value);
  const largeRate = parseFloat(document.getElementById('largeRate').value);
  const nim = parseFloat(document.getElementById('nimCost').value);
  if (isNaN(nim) || nim < 0) { toast('กรุณากรอกค่า Nim Express', 'error'); return; }
  const photos = collectStepPhotos();
  if (!updateShipment(state.currentId, s => ({
    ...s, stepE: {
      smallBoxes, largeBoxes,
      smallRate: isNaN(smallRate) ? NIM_SMALL_RATE : smallRate,
      largeRate: isNaN(largeRate) ? NIM_LARGE_RATE : largeRate,
      nimExpressCost: nim,
      photos, completed: true
    }
  }))) return;
  toast('บันทึกเรียบร้อย ✓', 'success');
  state.view = state.mode === 'owner' ? 'owner-detail' : 'staff-detail';
  render();
}
function confirmReceive(id) {
  confirmModal('ยืนยันรับของ', `ยืนยันว่าได้รับ ${id} ครบถ้วนแล้ว?`, () => {
    if (!updateShipment(id, s => ({ ...s, confirmed: true, confirmedAt: new Date().toISOString() }))) return;
    toast('ยืนยันรับของเรียบร้อย ✓', 'success');
    state.view = state.mode === 'owner' ? 'owner-detail' : 'staff-detail';
    render();
  }, 'ยืนยัน', 'btn-success');
}

/* ============ Card บริการ ============ */
const CARD_TYPE_LABEL = { annual: 'รายปี', lifetime: 'ตลอดชีพ' };
const CARD_PHOTO_CATEGORIES = [
  { key: 'agent_transfer', label: 'โอนเงินให้ตัวแทน',      icon: '🏦' },
  { key: 'china_transfer', label: 'ตัวแทนโอนไปจีน',         icon: '💴' }
];
const CARD_PHOTO_CAT_INFO = {};
CARD_PHOTO_CATEGORIES.forEach(c => { CARD_PHOTO_CAT_INFO[c.key] = c; });

// state ระหว่างกรอกฟอร์ม Card: { category: [{fileId,...}] }
let tempCardPhotosByCategory = {};

function loadTempCardPhotos(card) {
  tempCardPhotosByCategory = {};
  (card?.photos || []).forEach(p => {
    if (!p || !p.fileId) return;
    const k = p.category || 'general';
    (tempCardPhotosByCategory[k] = tempCardPhotosByCategory[k] || []).push(p);
  });
}

function collectCardPhotos() {
  const out = [];
  Object.entries(tempCardPhotosByCategory).forEach(([cat, list]) => {
    list.forEach(p => out.push(Object.assign({}, p, { category: cat })));
  });
  return out;
}

async function uploadCardPhotoToCloud(dataUrl, cardId, category) {
  return await cloudCall('uploadCardPhoto', { payload: { cardId, category, dataUrl } });
}

function renderCardPhotoGrid(catKey) {
  const list = tempCardPhotosByCategory[catKey] || [];
  return list.map((p, i) => {
    const preview = isPdfAttachment(p)
      ? `<div class="pdf-thumb">📄<span class="pdf-label">PDF</span></div>`
      : `<img src="${p.thumbUrl || p.url}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.opacity='0.3'">`;
    return `
      <div class="photo-thumb">
        ${preview}
        <a class="view-photo" href="${p.viewUrl || p.url}" target="_blank" rel="noopener" title="${isPdfAttachment(p) ? 'เปิดดู PDF' : 'เปิดดูภาพ'}">↗</a>
        <button class="delete-photo" onclick="removeCardPhoto('${catKey}', ${i})">×</button>
      </div>
    `;
  }).join('');
}

function renderCardPhotoSection(cat) {
  return `
    <div class="photo-cat-block">
      <div class="photo-cat-head">
        <span>${cat.icon} ${cat.label}</span>
        <span class="count" id="card-count-${cat.key}">${(tempCardPhotosByCategory[cat.key] || []).length} รูป</span>
      </div>
      <div class="photo-grid" id="card-grid-${cat.key}">${renderCardPhotoGrid(cat.key)}</div>
      <label class="photo-add" style="display:inline-flex;margin-top:8px;width:80px;font-size:24px">
        <input type="file" accept="image/*,application/pdf" multiple onchange="uploadCardPhotos(this, '${cat.key}')">
        ＋
      </label>
    </div>
  `;
}

function refreshCardCategoryGrid(catKey) {
  const gridEl = document.getElementById('card-grid-' + catKey);
  if (gridEl) gridEl.innerHTML = renderCardPhotoGrid(catKey);
  const countEl = document.getElementById('card-count-' + catKey);
  if (countEl) countEl.textContent = (tempCardPhotosByCategory[catKey] || []).length + ' รูป';
}

async function uploadCardPhotos(input, catKey) {
  if (!cloudEnabled()) { toast('ต้องตั้งค่า Cloud sync ก่อน', 'error'); input.value = ''; return; }
  if (!isOnline()) { toast('ต้องออนไลน์เพื่ออัปโหลดรูป', 'error'); input.value = ''; return; }
  const cardId = state.currentCardId;
  if (!cardId) { toast('ไม่พบ Card ID', 'error'); input.value = ''; return; }
  const files = [...input.files];
  input.value = '';
  const gridEl = document.getElementById('card-grid-' + catKey);
  for (const f of files) {
    let placeholder;
    if (gridEl) {
      placeholder = document.createElement('div');
      placeholder.className = 'photo-uploading';
      placeholder.textContent = '⏳';
      gridEl.appendChild(placeholder);
    }
    try {
      const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      const data = isPdf ? await readFileAsDataURL(f) : await compressImage(f);
      const meta = await uploadCardPhotoToCloud(data, cardId, catKey);
      const list = (tempCardPhotosByCategory[catKey] = tempCardPhotosByCategory[catKey] || []);
      list.push(Object.assign({ category: catKey }, meta));
    } catch (e) {
      console.error(e);
      toast('อัปโหลดล้มเหลว: ' + (e.message || e), 'error');
    } finally {
      if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
    }
  }
  refreshCardCategoryGrid(catKey);
}

function removeCardPhoto(catKey, idx) {
  const list = tempCardPhotosByCategory[catKey];
  if (!list || !list[idx]) return;
  const removed = list.splice(idx, 1)[0];
  refreshCardCategoryGrid(catKey);
  if (removed?.fileId && cloudEnabled() && isOnline()) {
    cloudCall('deletePhoto', { payload: { fileId: removed.fileId } }).catch(() => {});
  }
}

function renderCardPhotosViewer(card) {
  const photos = (card?.photos || []).filter(p => p && p.fileId);
  if (photos.length === 0) return '';
  const byCat = {};
  photos.forEach(p => {
    const k = p.category || 'general';
    (byCat[k] = byCat[k] || []).push(p);
  });
  return Object.entries(byCat).map(([catKey, list]) => {
    const info = CARD_PHOTO_CAT_INFO[catKey] || { icon: '📎', label: catKey };
    return `
      <div style="margin-top:10px">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">${info.icon} ${escapeHtml(info.label)} · ${list.length} รูป</div>
        <div class="photo-grid">
          ${list.map(p => {
            const isPdf = isPdfAttachment(p);
            const preview = isPdf
              ? `<div class="pdf-thumb">📄<span class="pdf-label">PDF</span></div>`
              : `<img src="${p.thumbUrl || p.url}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.opacity='0.3'">`;
            return `
            <a class="photo-thumb" href="${p.viewUrl || p.url}" target="_blank" rel="noopener" title="${isPdf ? 'เปิดดู PDF' : 'ดูภาพเต็ม'}">
              ${preview}
              <span class="view-photo" style="pointer-events:none">↗</span>
            </a>`;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

// แปลง shape เก่า (cardType + cardCount + pricePerCard) → ใหม่ (annual + lifetime + freeCount)
function normalizeCard(c) {
  if (!c) return c;
  if (!c.annual)   c.annual   = { count: 0, pricePerCard: 0, freeCount: 0 };
  if (!c.lifetime) c.lifetime = { count: 0, pricePerCard: 0, freeCount: 0 };
  // legacy migration: ถ้า annual/lifetime ทั้งคู่ว่าง แต่มี cardType/cardCount เก่า → กระจาย
  const empty = (t) => (Number(t.count) || 0) === 0 && (Number(t.pricePerCard) || 0) === 0;
  if (empty(c.annual) && empty(c.lifetime) && c.cardType && (Number(c.cardCount) || Number(c.pricePerCard))) {
    const seed = { count: Number(c.cardCount) || 0, pricePerCard: Number(c.pricePerCard) || 0, freeCount: 0 };
    if (c.cardType === 'lifetime') c.lifetime = seed; else c.annual = seed;
  }
  ['annual', 'lifetime'].forEach(k => {
    c[k].count        = Number(c[k].count) || 0;
    c[k].pricePerCard = Number(c[k].pricePerCard) || 0;
    c[k].freeCount    = Number(c[k].freeCount) || 0;
  });
  // ทิ้ง legacy field — clear เพื่อไม่ให้ไป confuse readers
  delete c.cardType; delete c.cardCount; delete c.pricePerCard;
  return c;
}

// คำนวณยอดรวม + ต้นทุนต่อใบ (หาร "จำนวนซื้อ + จำนวนแถม") ต่อประเภท
function cardTypeStats(t) {
  const count = Number(t?.count) || 0;
  const price = Number(t?.pricePerCard) || 0;
  const free  = Number(t?.freeCount) || 0;
  const gross = count * price;
  const totalCards = count + free;
  const costPerCard = totalCards > 0 ? gross / totalCards : 0;
  return { count, price, free, gross, totalCards, costPerCard };
}
function cardTotals(c) {
  const a = cardTypeStats(c?.annual);
  const l = cardTypeStats(c?.lifetime);
  return { annual: a, lifetime: l, gross: a.gross + l.gross, totalCards: a.totalCards + l.totalCards };
}

function renderCardList() {
  renderTopbar('Card บริการ', false);
  const all = loadCards().map(normalizeCard).slice().sort((a,b) => {
    const da = a.payDate || a.createdAt || '';
    const db = b.payDate || b.createdAt || '';
    return db.localeCompare(da);
  });

  const totals = all.reduce((acc, c) => {
    const t = cardTotals(c);
    acc.gross += t.gross;
    acc.annualCards   += t.annual.totalCards;
    acc.lifetimeCards += t.lifetime.totalCards;
    acc.annualSpend   += t.annual.gross;
    acc.lifetimeSpend += t.lifetime.gross;
    return acc;
  }, { gross: 0, annualCards: 0, lifetimeCards: 0, annualSpend: 0, lifetimeSpend: 0 });
  const avgAnnual   = totals.annualCards   > 0 ? totals.annualSpend   / totals.annualCards   : 0;
  const avgLifetime = totals.lifetimeCards > 0 ? totals.lifetimeSpend / totals.lifetimeCards : 0;

  let listHtml;
  if (all.length === 0) {
    listHtml = `<div class="empty"><div class="icon">💳</div><p>ยังไม่มีรายการซื้อ Card<br>กดปุ่มด้านล่างเพื่อบันทึก</p></div>`;
  } else {
    listHtml = all.map(c => {
      const t = cardTotals(c);
      const typeBadges = [];
      if (t.annual.totalCards   > 0) typeBadges.push(`<span class="badge">รายปี</span>`);
      if (t.lifetime.totalCards > 0) typeBadges.push(`<span class="badge" style="background:#ede9fe;color:var(--purple)">ตลอดชีพ</span>`);
      const breakdownRows = [];
      if (t.annual.count > 0 || t.annual.free > 0) {
        breakdownRows.push(`
          <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);padding:3px 0">
            <span>รายปี: ${fmtNum(t.annual.count)}${t.annual.free?` + แถม ${fmtNum(t.annual.free)}`:''} ใบ</span>
            <span><strong style="color:var(--text)">${fmtBaht(t.annual.costPerCard, 2)} ฿/ใบ</strong></span>
          </div>`);
      }
      if (t.lifetime.count > 0 || t.lifetime.free > 0) {
        breakdownRows.push(`
          <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);padding:3px 0">
            <span>ตลอดชีพ: ${fmtNum(t.lifetime.count)}${t.lifetime.free?` + แถม ${fmtNum(t.lifetime.free)}`:''} ใบ</span>
            <span><strong style="color:var(--text)">${fmtBaht(t.lifetime.costPerCard, 2)} ฿/ใบ</strong></span>
          </div>`);
      }
      return `
        <div class="shipment-card" onclick="openCard('${c.id}')">
          <div class="head">
            <div class="id">${escapeHtml(c.id)}</div>
            <div style="display:flex;gap:6px">${typeBadges.join('')}</div>
          </div>
          <div class="meta"><span>📅 ${fmtDate(c.payDate)}</span></div>
          <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)">
            ${breakdownRows.join('')}
          </div>
          <div class="footer">
            <span class="total">รวมจ่าย <strong>${fmtBaht(t.gross, 2)} ฿</strong></span>
            <span style="color:var(--text-muted);font-size:13px">${(c.photos||[]).length} หลักฐาน</span>
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('main').innerHTML = `
    <div class="summary-grid">
      <div class="summary-card"><div class="label">รายการทั้งหมด</div><div class="value">${all.length}</div></div>
      <div class="summary-card purple"><div class="label">ยอดซื้อรวม</div><div class="value" style="font-size:18px">${fmtBaht(totals.gross, 2)} ฿</div></div>
      <div class="summary-card orange"><div class="label">รายปี · ทุน/ใบ</div><div class="value" style="font-size:18px">${avgAnnual > 0 ? fmtBaht(avgAnnual, 2) : '-'} ฿</div></div>
      <div class="summary-card green"><div class="label">ตลอดชีพ · ทุน/ใบ</div><div class="value" style="font-size:18px">${avgLifetime > 0 ? fmtBaht(avgLifetime, 2) : '-'} ฿</div></div>
    </div>
    <div class="section-header"><h2>ประวัติการซื้อ</h2></div>
    ${listHtml}
    <button class="fab" onclick="newCard()">＋ บันทึกการซื้อใหม่</button>
  `;
  renderBottomBar('');
}

function openCard(id) {
  state.currentCardId = id;
  state.view = 'cards-form';
  render();
}

function newCard() {
  state.currentCardId = nextCardId();
  // สร้าง shell card ใน local ก่อน เพื่อให้ uploadCardPhoto อ้างถึงได้
  const now = new Date().toISOString();
  const shell = {
    id: state.currentCardId,
    createdAt: now,
    updatedAt: now,
    payDate: todayISO(),
    annual:   { count: 0, pricePerCard: 0, freeCount: 0 },
    lifetime: { count: 0, pricePerCard: 0, freeCount: 0 },
    photos: []
  };
  if (!upsertCardLocal(shell)) return;
  state.view = 'cards-form';
  render();
}

function renderCardTypeBlock(label, prefix, data) {
  const count = Number(data?.count) || 0;
  const price = Number(data?.pricePerCard) || 0;
  const free  = Number(data?.freeCount) || 0;
  const gross = count * price;
  const total = count + free;
  const cpc = total > 0 ? gross / total : 0;
  return `
    <div class="form-section">
      <h3>${label}</h3>
      <div class="field-grid">
        <div class="field">
          <label>จำนวนที่ซื้อ (ใบ)</label>
          <input type="number" id="card-${prefix}-count" min="0" inputmode="numeric" value="${count || ''}" oninput="recalcCardTotals()">
        </div>
        <div class="field">
          <label>ราคาต่อใบ (฿)</label>
          <input type="number" id="card-${prefix}-price" min="0" step="0.01" inputmode="decimal" value="${price || ''}" oninput="recalcCardTotals()">
        </div>
      </div>
      <div class="field">
        <label>จำนวนที่แถม (ใบ)</label>
        <input type="number" id="card-${prefix}-free" min="0" inputmode="numeric" value="${free || ''}" oninput="recalcCardTotals()">
        <div class="field-hint">กรอกหรือไม่กรอกก็ได้</div>
      </div>
      <div style="background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-direction:column;gap:4px">
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary)">
          <span>ราคารวม</span>
          <span id="card-${prefix}-gross">${fmtBaht(gross, 2)} ฿</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary)">
          <span>จำนวนทั้งหมด (รวมแถม)</span>
          <span id="card-${prefix}-total">${fmtNum(total)} ใบ</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:var(--primary);border-top:1px solid var(--border);padding-top:6px;margin-top:2px">
          <span>ต้นทุนต่อใบ</span>
          <span id="card-${prefix}-cpc">${total > 0 ? fmtBaht(cpc, 2) + ' ฿' : '-'}</span>
        </div>
      </div>
    </div>
  `;
}

function renderCardForm(id) {
  const c = normalizeCard(getCard(id));
  if (!c) { state.view = 'cards-dashboard'; render(); return; }
  renderTopbar(c.id);
  loadTempCardPhotos(c);

  const grand = cardTotals(c);

  document.getElementById('main').innerHTML = `
    <div class="form-section">
      <h3>💳 ข้อมูลการซื้อ</h3>
      <div class="field">
        <label>วันที่จ่ายเงิน <span class="req">*</span></label>
        <input type="date" id="card-payDate" value="${escapeHtml(c.payDate || todayISO())}">
      </div>
    </div>

    ${renderCardTypeBlock('📅 รายปี', 'annual', c.annual)}
    ${renderCardTypeBlock('♾️ ตลอดชีพ', 'lifetime', c.lifetime)}

    <div class="cost-summary">
      <h3>สรุปการซื้อครั้งนี้</h3>
      <div class="cost-row"><span>รายปี (รวมแถม)</span><span id="sum-annual-total">${fmtNum(grand.annual.totalCards)} ใบ</span></div>
      <div class="cost-row"><span>ตลอดชีพ (รวมแถม)</span><span id="sum-lifetime-total">${fmtNum(grand.lifetime.totalCards)} ใบ</span></div>
      <div class="cost-row divider total"><span>รวมจ่ายทั้งสิ้น</span><span id="sum-gross">${fmtBaht(grand.gross, 2)} ฿</span></div>
    </div>

    <div class="form-section">
      <h3>📸 หลักฐาน / รูปภาพ</h3>
      ${CARD_PHOTO_CATEGORIES.map(renderCardPhotoSection).join('')}
    </div>
  `;
  renderBottomBar(`
    <button class="btn btn-danger" onclick="confirmDeleteCard('${c.id}')">🗑 ลบ</button>
    <button class="btn btn-primary" onclick="saveCard()">บันทึก</button>
  `);
}

function readCardTypeInputs(prefix) {
  const count = Number(document.getElementById(`card-${prefix}-count`)?.value) || 0;
  const price = Number(document.getElementById(`card-${prefix}-price`)?.value) || 0;
  const free  = Number(document.getElementById(`card-${prefix}-free`)?.value)  || 0;
  return { count, pricePerCard: price, freeCount: free };
}

function recalcCardTotals() {
  let grandGross = 0;
  ['annual', 'lifetime'].forEach(prefix => {
    const { count, pricePerCard, freeCount } = readCardTypeInputs(prefix);
    const gross = count * pricePerCard;
    const total = count + freeCount;
    const cpc = total > 0 ? gross / total : 0;
    grandGross += gross;
    const g = document.getElementById(`card-${prefix}-gross`);
    const t = document.getElementById(`card-${prefix}-total`);
    const c = document.getElementById(`card-${prefix}-cpc`);
    const st = document.getElementById(`sum-${prefix}-total`);
    if (g) g.textContent = fmtBaht(gross, 2) + ' ฿';
    if (t) t.textContent = fmtNum(total) + ' ใบ';
    if (c) c.textContent = total > 0 ? fmtBaht(cpc, 2) + ' ฿' : '-';
    if (st) st.textContent = fmtNum(total) + ' ใบ';
  });
  const sg = document.getElementById('sum-gross');
  if (sg) sg.textContent = fmtBaht(grandGross, 2) + ' ฿';
}

function saveCard() {
  const c = getCard(state.currentCardId);
  if (!c) { toast('ไม่พบ Card', 'error'); return; }
  const payDate = document.getElementById('card-payDate').value;
  if (!payDate) { toast('ระบุวันที่จ่ายเงิน', 'error'); return; }
  const annual   = readCardTypeInputs('annual');
  const lifetime = readCardTypeInputs('lifetime');
  if (annual.count <= 0 && lifetime.count <= 0) {
    toast('ระบุจำนวนที่ซื้ออย่างน้อย 1 ประเภท', 'error'); return;
  }
  // validation: ประเภทใดที่กรอก count → ต้องกรอก price ด้วย
  if (annual.count > 0   && annual.pricePerCard   <= 0) { toast('ระบุราคาต่อใบของรายปี', 'error'); return; }
  if (lifetime.count > 0 && lifetime.pricePerCard <= 0) { toast('ระบุราคาต่อใบของตลอดชีพ', 'error'); return; }

  const photos = collectCardPhotos();
  const updated = Object.assign({}, c, {
    payDate, annual, lifetime, photos,
    updatedAt: new Date().toISOString()
  });
  delete updated.cardType; delete updated.cardCount; delete updated.pricePerCard;
  if (!upsertCardLocal(updated)) return;
  toast('บันทึกเรียบร้อย ✓', 'success');
  state.view = 'cards-dashboard';
  state.currentCardId = null;
  render();
}

function confirmDeleteCard(id) {
  const c = getCard(id);
  if (!c) return;
  confirmModal(
    'ลบรายการ Card',
    `ต้องการลบ ${c.id} ทั้งหมด (รวมรูป/PDF) ใช่หรือไม่?`,
    () => {
      deleteCardLocal(id);
      toast('ลบแล้ว', 'success');
      state.view = 'cards-dashboard';
      state.currentCardId = null;
      render();
    },
    'ลบ', 'btn-danger'
  );
}
