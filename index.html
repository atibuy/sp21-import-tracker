<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e40af">
<title>ระบบติดตามนำเข้าสินค้าจากจีน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #1e40af;
    --primary-dark: #1e3a8a;
    --primary-light: #3b82f6;
    --primary-50: #eff6ff;
    --primary-100: #dbeafe;
    --bg: #f1f5f9;
    --surface: #ffffff;
    --text: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --border: #e2e8f0;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #06b6d4;
    --purple: #8b5cf6;
    --shadow: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
    --shadow-lg: 0 10px 30px rgba(15,23,42,0.12);
    --radius: 14px;
    --radius-sm: 10px;
  }
  html, body {
    font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }
  body { font-size: 16px; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; font-size: 16px; }
  img { max-width: 100%; display: block; }

  /* Layout */
  .app { max-width: 720px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 2px 12px rgba(30,64,175,0.25);
  }
  .topbar h1 { font-size: 18px; font-weight: 600; flex: 1; letter-spacing: 0.2px; }
  .topbar .back-btn {
    width: 40px; height: 40px; border-radius: 10px;
    background: rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; transition: background 0.15s;
  }
  .topbar .back-btn:active { background: rgba(255,255,255,0.25); }
  .topbar .mode-badge {
    background: rgba(255,255,255,0.18); padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
  }
  .topbar .switch-btn {
    background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 8px;
    font-size: 13px; font-weight: 500;
  }
  main { flex: 1; padding: 16px; padding-bottom: 100px; }

  /* Mode select */
  .mode-screen {
    min-height: calc(100vh - 60px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .mode-logo {
    width: 80px; height: 80px; border-radius: 20px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; color: #fff; margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(30,64,175,0.3);
  }
  .mode-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
  .mode-subtitle { color: var(--text-secondary); margin-bottom: 32px; font-size: 14px; }
  .mode-cards { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }
  .mode-card {
    background: var(--surface); border-radius: var(--radius); padding: 20px;
    display: flex; align-items: center; gap: 16px; text-align: left;
    box-shadow: var(--shadow); border: 2px solid transparent;
    transition: all 0.2s;
  }
  .mode-card:active { transform: scale(0.98); border-color: var(--primary-light); }
  .mode-card .icon {
    width: 52px; height: 52px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    flex-shrink: 0;
  }
  .mode-card .icon.owner { background: var(--primary-100); color: var(--primary); }
  .mode-card .icon.staff { background: #d1fae5; color: var(--success); }
  .mode-card .icon.cards { background: #ede9fe; color: var(--purple); }
  .mode-card .info { flex: 1; }
  .mode-card .info h3 { font-size: 17px; font-weight: 600; margin-bottom: 2px; }
  .mode-card .info p { color: var(--text-secondary); font-size: 13px; }
  .mode-card .arrow { color: var(--text-muted); font-size: 22px; }

  /* Dashboard */
  .summary-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px;
  }
  .summary-card {
    background: var(--surface); border-radius: var(--radius-sm); padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .summary-card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .summary-card .value { font-size: 22px; font-weight: 700; color: var(--primary); }
  .summary-card.green .value { color: var(--success); }
  .summary-card.orange .value { color: var(--warning); }
  .summary-card.purple .value { color: var(--purple); }

  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin: 16px 0 10px;
  }
  .section-header h2 { font-size: 15px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.3px; }
  .filter-tabs {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin: 0 -16px 12px; padding-left: 16px; padding-right: 16px;
    scrollbar-width: none;
  }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .filter-tab {
    padding: 7px 14px; border-radius: 999px; background: var(--surface);
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    white-space: nowrap; border: 1px solid var(--border);
  }
  .filter-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* Shipment card */
  .shipment-card {
    background: var(--surface); border-radius: var(--radius); padding: 14px;
    margin-bottom: 10px; box-shadow: var(--shadow); cursor: pointer;
    transition: transform 0.15s;
  }
  .shipment-card:active { transform: scale(0.99); }
  .shipment-card .head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .shipment-card .id { font-weight: 700; font-size: 16px; color: var(--primary); }
  .badge {
    padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
    background: var(--primary-100); color: var(--primary);
  }
  .shipment-card .meta {
    display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; color: var(--text-secondary);
    margin-top: 6px;
  }
  .shipment-card .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .shipment-card .sku-list {
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
    font-size: 13px; color: var(--text-secondary);
  }
  .shipment-card .footer {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .shipment-card .footer .total {
    font-size: 13px; color: var(--text-muted);
  }
  .shipment-card .footer .total strong { color: var(--text); font-size: 15px; }

  /* Empty state */
  .empty {
    text-align: center; padding: 60px 20px; color: var(--text-muted);
  }
  .empty .icon { font-size: 56px; margin-bottom: 12px; opacity: 0.4; }
  .empty p { font-size: 14px; }

  /* FAB */
  .fab {
    position: fixed; bottom: 20px; right: 50%;
    transform: translateX(348px);
    z-index: 30;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff; padding: 14px 22px; border-radius: 999px;
    font-size: 15px; font-weight: 600;
    box-shadow: 0 6px 20px rgba(30,64,175,0.4);
    display: flex; align-items: center; gap: 8px;
    transition: transform 0.15s;
  }
  .fab:active { transform: translateX(348px) scale(0.96); }
  @media (max-width: 720px) {
    .fab { right: 20px; transform: none; }
    .fab:active { transform: scale(0.96); }
  }

  /* Detail view */
  .detail-header {
    background: var(--surface); border-radius: var(--radius); padding: 16px;
    margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .detail-header .id-row {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .detail-header h2 { font-size: 22px; font-weight: 700; color: var(--primary); }
  .detail-header .info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .info-item { font-size: 13px; }
  .info-item .label { color: var(--text-muted); margin-bottom: 2px; }
  .info-item .value { color: var(--text); font-weight: 500; }

  /* Step cards */
  .step-card {
    background: var(--surface); border-radius: var(--radius); margin-bottom: 12px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .step-card .step-header {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    cursor: pointer;
  }
  .step-card .step-num {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--bg); color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
    flex-shrink: 0;
  }
  .step-card.completed .step-num { background: var(--success); color: #fff; }
  .step-card.current .step-num { background: var(--primary); color: #fff; }
  .step-card .step-title { flex: 1; }
  .step-card .step-title .title { font-weight: 600; font-size: 15px; }
  .step-card .step-title .subtitle { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .step-card .step-action {
    color: var(--primary); font-size: 13px; font-weight: 500;
    padding: 6px 12px; border-radius: 8px; background: var(--primary-50);
  }
  .step-card .step-body {
    padding: 0 16px 14px; font-size: 13px; color: var(--text-secondary);
  }
  .step-card .step-body .data-row {
    display: flex; justify-content: space-between; padding: 4px 0;
    border-top: 1px solid var(--border);
  }
  .step-card .step-body .data-row:first-child { border-top: none; }
  .step-card .step-body .data-row .v { color: var(--text); font-weight: 500; }

  /* Forms */
  .form-section {
    background: var(--surface); border-radius: var(--radius); padding: 16px;
    margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .form-section h3 {
    font-size: 16px; font-weight: 600; margin-bottom: 14px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .form-section h3 .step-badge {
    display: inline-block; padding: 3px 9px; border-radius: 6px;
    background: var(--primary); color: #fff; font-size: 12px; font-weight: 600;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 13px; font-weight: 500;
    color: var(--text-secondary); margin-bottom: 6px;
  }
  .field label .req { color: var(--danger); }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 13px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: #fff; color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,64,175,0.1);
  }
  .field input[type="file"] { padding: 8px; }
  .field-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field-grid .field { margin-bottom: 0; }
  .radio-group { display: flex; gap: 10px; }
  .radio-card {
    flex: 1; padding: 12px; border: 2px solid var(--border);
    border-radius: var(--radius-sm); text-align: center; cursor: pointer;
    transition: all 0.15s; font-weight: 600;
  }
  .radio-card.selected { border-color: var(--primary); background: var(--primary-50); color: var(--primary); }
  .radio-card input { display: none; }
  .alloc-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  }
  .alloc-card {
    padding: 12px 8px; border: 2px solid var(--border);
    border-radius: var(--radius-sm); text-align: center; cursor: pointer;
    transition: all 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .alloc-card input { display: none; }
  .alloc-card.selected { border-color: var(--primary); background: var(--primary-50); }
  .alloc-card .alloc-icon { font-size: 24px; line-height: 1; margin-bottom: 4px; }
  .alloc-card .alloc-label { font-size: 13px; font-weight: 600; color: var(--text); }
  .alloc-card.selected .alloc-label { color: var(--primary); }
  .alloc-card .alloc-sub { font-size: 11px; color: var(--text-muted); }

  /* Items list */
  .item-row {
    background: var(--bg); border-radius: var(--radius-sm); padding: 12px;
    margin-bottom: 10px; position: relative;
  }
  .item-row .item-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
  }
  .item-row .item-num { font-size: 13px; font-weight: 600; color: var(--primary); }
  .item-row .remove-btn {
    color: var(--danger); font-size: 13px; font-weight: 500;
    padding: 4px 10px; border-radius: 6px; background: rgba(239,68,68,0.1);
  }
  .add-item-btn {
    width: 100%; padding: 12px; border-radius: var(--radius-sm);
    border: 2px dashed var(--border); color: var(--primary);
    font-weight: 600; font-size: 14px; background: transparent;
    margin-top: 4px;
  }
  .add-item-btn:active { background: var(--primary-50); }

  /* Photos */
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .photo-thumb {
    aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden;
    background: var(--bg); position: relative;
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .pdf-thumb {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text-secondary);
    font-size: 32px; gap: 2px;
  }
  .pdf-thumb .pdf-label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: #e11d48; }
  .photo-thumb .delete-photo {
    position: absolute; top: 4px; right: 4px;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(239,68,68,0.9); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
  .photo-add {
    aspect-ratio: 1; border-radius: var(--radius-sm);
    border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 28px;
    cursor: pointer;
  }
  .photo-add input { display: none; }
  .photo-thumb .view-photo {
    position: absolute; top: 4px; left: 4px;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(30,64,175,0.85); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; text-decoration: none;
  }
  .photo-cat-block { margin-top: 12px; }
  .photo-cat-block:first-child { margin-top: 0; }
  .photo-cat-head {
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .photo-cat-head .count {
    margin-left: auto; font-size: 11px; color: var(--text-muted); font-weight: 500;
  }
  .photo-uploading {
    display: inline-flex; align-items: center; justify-content: center;
    aspect-ratio: 1; background: var(--primary-50); color: var(--primary);
    border-radius: var(--radius-sm); font-size: 12px; font-weight: 500;
  }

  /* Bottom button bar */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); padding: 12px 16px;
    box-shadow: 0 -2px 12px rgba(15,23,42,0.06);
    display: flex; gap: 10px;
    max-width: 720px; margin: 0 auto;
    border-top: 1px solid var(--border);
    z-index: 40;
  }
  .btn {
    flex: 1; padding: 13px 16px; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-secondary { background: var(--bg); color: var(--text); }
  .btn-ghost { background: transparent; color: var(--primary); }

  /* Cost summary */
  .cost-summary {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff; border-radius: var(--radius); padding: 16px;
    margin-bottom: 14px;
  }
  .cost-summary h3 { font-size: 14px; opacity: 0.85; margin-bottom: 8px; font-weight: 500; }
  .cost-row {
    display: flex; justify-content: space-between; padding: 6px 0;
    font-size: 14px;
  }
  .cost-row.divider { border-top: 1px solid rgba(255,255,255,0.2); margin-top: 6px; padding-top: 10px; }
  .cost-row.total { font-size: 16px; font-weight: 600; }
  .cost-sku-card {
    background: var(--surface); border-radius: var(--radius-sm); padding: 12px;
    margin-bottom: 8px; box-shadow: var(--shadow);
  }
  .cost-sku-card .sku-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; color: var(--text); }
  .cost-sku-card .cost-detail { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); padding: 2px 0; }
  .cost-sku-card .cost-per-unit {
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .cost-sku-card .cost-per-unit .label { font-size: 12px; color: var(--text-muted); }
  .cost-sku-card .cost-per-unit .value { font-size: 18px; font-weight: 700; color: var(--success); }

  /* Toast */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: 10px 18px;
    border-radius: 999px; font-size: 14px; font-weight: 500;
    box-shadow: var(--shadow-lg); z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--danger); }
  .toast.success { background: var(--success); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(15,23,42,0.5);
    z-index: 90; display: flex; align-items: flex-end;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-backdrop.show { opacity: 1; pointer-events: auto; }
  @media (min-width: 480px) {
    .modal-backdrop { align-items: center; justify-content: center; }
  }
  .modal {
    background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px; width: 100%; max-width: 460px;
    transform: translateY(20px); transition: transform 0.2s;
  }
  @media (min-width: 480px) { .modal { border-radius: var(--radius); } }
  .modal-backdrop.show .modal { transform: translateY(0); }
  .modal h3 { margin-bottom: 8px; font-size: 17px; }
  .modal p { color: var(--text-secondary); margin-bottom: 16px; font-size: 14px; }
  .modal-actions { display: flex; gap: 10px; }

  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px;
  }

  /* Searchable combobox */
  .combo { position: relative; }
  .combo-input {
    width: 100%; padding: 11px 38px 11px 13px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>') no-repeat right 12px center;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .combo-input:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,64,175,0.1);
  }
  .combo-input.has-value { font-weight: 500; }
  .combo-dropdown {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
    max-height: 280px; overflow-y: auto; z-index: 60;
    display: none;
  }
  .combo-dropdown.show { display: block; }
  .combo-option {
    padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .combo-option:last-child { border-bottom: none; }
  .combo-option:hover, .combo-option.highlighted { background: var(--primary-50); }
  .combo-option .opt-sku { font-weight: 600; font-size: 14px; color: var(--primary); }
  .combo-option .opt-name { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .combo-option mark { background: #fef08a; color: inherit; padding: 0 2px; border-radius: 2px; }
  .combo-empty {
    padding: 16px; text-align: center; color: var(--text-muted); font-size: 13px;
  }
  .combo-clear {
    position: absolute; right: 32px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--border); color: var(--text-secondary);
    display: none; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .combo.has-value .combo-clear { display: flex; }
  .selected-sku-name {
    font-size: 12px; color: var(--text-secondary); margin-top: 4px;
    padding: 4px 8px; background: var(--primary-50); border-radius: 6px;
    display: none;
  }
  .selected-sku-name.show { display: block; }
  .progress-line {
    height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    margin-top: 10px;
  }
  .progress-line .fill {
    height: 100%; background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
    transition: width 0.3s;
  }
  #sync-dot {
    position: fixed; top: 10px; right: 10px; z-index: 9999;
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600; color: #fff;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
    pointer-events: none; transition: opacity 0.25s;
  }
  #sync-dot::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%; background: #9ca3af;
  }
  #sync-dot.online::before  { background: #10b981; }
  #sync-dot.offline::before { background: #ef4444; }
  #sync-dot.queued::before  { background: #f59e0b; }
  #sync-dot.syncing::before { background: #3b82f6; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
</style>

// ปล่อย '' ไว้  จะใช้งานแบบ offline-only (เก็บใน localStorage อย่างเดียว)
const CLOUD_CONFIG = {
  webAppUrl: 'https://script.google.com/macros/s/AKfycbyCyl9q8yTSxY6ByMVjlQBJCdBh8Z9I5Fv9cBaIEi75nbrm9ZVyQJ_Vvjj6SUtZQnWC0g/exec'
};
const SYNC_QUEUE_KEY = 'shipments_pendingSync';
const STORAGE_KEY = 'shipments';
const STORAGE_KEY_CARDS = 'cards';

function cloudEnabled() { return !!CLOUD_CONFIG.webAppUrl; }
function isOnline() { return typeof navigator === 'undefined' ? true : navigator.onLine !== false; }

async function cloudCall(action, body) {
  if (!cloudEnabled()) throw new Error('cloud-disabled');
  const res = await fetch(CLOUD_CONFIG.webAppUrl, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action }, body || {})),
    redirect: 'follow'
  });
  if (!res.ok) throw new Error('http-' + res.status);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'server-error');
  return data.data;
}

function setSyncStatus(state, msg) {
  const el = document.getElementById('sync-dot');
  if (!el) return;
  if (!cloudEnabled()) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.className = state || '';
  el.textContent = msg || (
    state === 'online'  ? 'ออนไลน์' :
    state === 'offline' ? 'ออฟไลน์' :
    state === 'queued'  ? 'รอ sync' :
    state === 'syncing' ? 'กำลัง sync' : ''
  );
}

/* ============ Pending sync queue ============ */
function readQueue() {
  try { return JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]'); }
  catch { return []; }
}
function writeQueue(q) {
  try { localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(q)); } catch {}
}
function enqueueOp(op) {
  const q = readQueue();
  // ถ้ามี op save/delete ของ id เดิมอยู่แล้ว ให้แทนที่ (เอาค่าล่าสุดพอ)
  const sameTarget = o => {
    if (op.action !== o.action) return false;
    if (op.action === 'delete')     return o.id === op.id;
    if (op.action === 'deleteCard') return o.id === op.id;
    if (op.action === 'save')       return o.payload?.shipment?.id === op.payload?.shipment?.id;
    if (op.action === 'saveCard')   return o.payload?.card?.id === op.payload?.card?.id;
    return false;
  };
  const filtered = q.filter(o => !sameTarget(o));
  filtered.push(Object.assign({ queuedAt: Date.now() }, op));
  writeQueue(filtered);
  setSyncStatus('queued', `รอ sync (${filtered.length})`);
}

async function drainQueue() {
  if (!cloudEnabled() || !isOnline()) return;
  const q = readQueue();
  if (q.length === 0) return;
  setSyncStatus('syncing', `กำลัง sync (${q.length})`);
  const remaining = [];
  for (const op of q) {
    try {
      const body = op.payload ? { payload: op.payload } : { id: op.id };
      await cloudCall(op.action, body);
    } catch (e) {
      remaining.push(op);
    }
  }
  writeQueue(remaining);
  setSyncStatus(remaining.length === 0 ? 'online' : 'queued',
    remaining.length === 0 ? 'ออนไลน์' : `รอ sync (${remaining.length})`);
}

/* ============ Cloud writers (fire-and-forget, auto-queue) ============ */
function buildCloudPayload(s) {
  // แนบ cost snapshot ไปด้วย ให้ sheet "Costs" มีข้อมูลล่าสุด
  let costSnapshot = null;
  try { costSnapshot = calcCosts(s); } catch {}
  return { shipment: s, costSnapshot };
}

function cloudPush(s) {
  if (!cloudEnabled()) return;
  const payload = buildCloudPayload(s);
  if (!isOnline()) { enqueueOp({ action: 'save', payload }); return; }
  setSyncStatus('syncing');
  cloudCall('save', { payload })
    .then(() => { if (readQueue().length === 0) setSyncStatus('online'); else drainQueue(); })
    .catch(() => { enqueueOp({ action: 'save', payload }); });
}

function cloudDelete(id) {
  if (!cloudEnabled()) return;
  if (!isOnline()) { enqueueOp({ action: 'delete', id }); return; }
  setSyncStatus('syncing');
  cloudCall('delete', { id })
    .then(() => { if (readQueue().length === 0) setSyncStatus('online'); else drainQueue(); })
    .catch(() => { enqueueOp({ action: 'delete', id }); });
}

/* ============ Storage (localStorage = source of truth สำหรับ runtime; cloud = sync target) ============ */
function loadShipments() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}
function saveShipmentsLocal(arr) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    return true;
  } catch (e) {
    toast('พื้นที่เก็บข้อมูลเต็ม — ลองลบรูปภาพบางส่วน', 'error');
    return false;
  }
}
// คงชื่อเดิมไว้เพื่อ backward-compat (ใช้ตอนสร้าง shipment ใหม่)
function saveShipments(arr) { return saveShipmentsLocal(arr); }

function getShipment(id) { return loadShipments().find(s => s.id === id); }

function updateShipment(id, updater) {
  const all = loadShipments();
  const idx = all.findIndex(s => s.id === id);
  if (idx === -1) return false;
  all[idx] = updater(all[idx]);
  all[idx].updatedAt = new Date().toISOString();
  if (!saveShipmentsLocal(all)) return false;
  cloudPush(all[idx]);
  return true;
}
function deleteShipment(id) {
  const all = loadShipments().filter(s => s.id !== id);
  if (!saveShipmentsLocal(all)) return false;
  cloudDelete(id);
  return true;
}

/* ============ Cards storage + sync ============ */
function loadCards() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY_CARDS) || '[]'); }
  catch { return []; }
}
function saveCardsLocal(arr) {
  try {
    localStorage.setItem(STORAGE_KEY_CARDS, JSON.stringify(arr));
    return true;
  } catch (e) {
    toast('พื้นที่เก็บข้อมูลเต็ม', 'error');
    return false;
  }
}
function getCard(id) { return loadCards().find(c => c.id === id); }

function cloudPushCard(c) {
  if (!cloudEnabled()) return;
  const payload = { card: c };
  if (!isOnline()) { enqueueOp({ action: 'saveCard', payload }); return; }
  setSyncStatus('syncing');
  cloudCall('saveCard', { payload })
    .then(() => { if (readQueue().length === 0) setSyncStatus('online'); else drainQueue(); })
    .catch(() => { enqueueOp({ action: 'saveCard', payload }); });
}

function cloudDeleteCard(id) {
  if (!cloudEnabled()) return;
  if (!isOnline()) { enqueueOp({ action: 'deleteCard', id }); return; }
  setSyncStatus('syncing');
  cloudCall('deleteCard', { id })
    .then(() => { if (readQueue().length === 0) setSyncStatus('online'); else drainQueue(); })
    .catch(() => { enqueueOp({ action: 'deleteCard', id }); });
}

function upsertCardLocal(card) {
  const all = loadCards();
  const idx = all.findIndex(c => c.id === card.id);
  if (idx === -1) all.push(card); else all[idx] = card;
  if (!saveCardsLocal(all)) return false;
  cloudPushCard(card);
  return true;
}

function deleteCardLocal(id) {
  const all = loadCards().filter(c => c.id !== id);
  if (!saveCardsLocal(all)) return false;
  cloudDeleteCard(id);
  return true;
}

function nextCardId() {
  const beYear2 = String((new Date().getFullYear() + 543) % 100).padStart(2, '0');
  const prefix = `CARD-${beYear2}-`;
  const all = loadCards();
  const max = all.filter(c => c.id.startsWith(prefix))
    .reduce((m, c) => Math.max(m, parseInt(c.id.slice(prefix.length), 10) || 0), 0);
  return `${prefix}${String(max + 1).padStart(3, '0')}`;
}

/* ============ Bootstrap from cloud (with localStorage fallback) ============ */
async function bootstrapFromCloud() {
  if (!cloudEnabled()) { setSyncStatus(); return; }
  setSyncStatus('syncing', 'กำลังโหลด...');
  try {
    const [remote, remoteCards] = await Promise.all([
      cloudCall('list').catch(() => null),
      cloudCall('listCards').catch(() => null)
    ]);
    if (Array.isArray(remote)) {
      const local = loadShipments();
      const remoteIds = new Set(remote.map(r => r.id));
      // shipments ที่อยู่ใน local แต่ cloud ยังไม่มี — เก็บไว้ + queue ไป sync ขึ้น cloud
      const localOnly = local.filter(s => !remoteIds.has(s.id));
      localOnly.forEach(s => enqueueOp({ action: 'save', payload: buildCloudPayload(s) }));
      saveShipmentsLocal(remote.concat(localOnly));
    }
    if (Array.isArray(remoteCards)) {
      const local = loadCards();
      const remoteIds = new Set(remoteCards.map(r => r.id));
      const localOnly = local.filter(c => !remoteIds.has(c.id));
      localOnly.forEach(c => enqueueOp({ action: 'saveCard', payload: { card: c } }));
      saveCardsLocal(remoteCards.concat(localOnly));
    }
    setSyncStatus('online');
  } catch (e) {
    setSyncStatus('offline', 'ออฟไลน์ — ใช้ข้อมูลในเครื่อง');
  }
  drainQueue();
}
function nextShipmentId() {
  const beYear2 = String((new Date().getFullYear() + 543) % 100).padStart(2, '0');
  const prefix = `SH-${beYear2}-`;
  const all = loadShipments();
  const max = all.filter(s => s.id.startsWith(prefix))
    .reduce((m, s) => Math.max(m, parseInt(s.id.slice(prefix.length), 10) || 0), 0);
  return `${prefix}${String(max + 1).padStart(3, '0')}`;
}

/* ============ Utilities ============ */
function computeStatus(s) {
  if (s.confirmed) return 'complete';
  if (s.stepE && s.stepE.completed) return 'warehouse';
  if (s.stepD && s.stepD.completed) return 'arrived';
  if (s.stepC && s.stepC.completed) return 'transit';
  if (s.stepB && s.stepB.completed) return 'shipped';
  return 'ordered';
}
function fmtBaht(n, decimals = 2) {
  if (n == null || isNaN(n)) return '-';
  return Number(n).toLocaleString('th-TH', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtNum(n) {
  if (n == null || isNaN(n)) return '-';
  return Number(n).toLocaleString('th-TH');
}
function fmtDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const day = String(d.getDate()).padStart(2, '0');
  const mon = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][d.getMonth()];
  const year = (d.getFullYear() + 543) % 100;
  return `${day} ${mon} ${year}`;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shortName(s, max = 30) {
  if (!s) return '-';
  const str = String(s);
  return str.length > max ? str.slice(0, max - 1) + '…' : str;
}

const ALLOC_LABEL = {
  volume: 'แบ่งตามปริมาตร (คิว)',
  weight: 'แบ่งตามน้ำหนัก (กก.)',
  boxes:  'แบ่งตามจำนวนลัง',
  yuan:   'แบ่งตามราคาสินค้า (¥)'
};
function calcCosts(s) {
  if (!s.stepA || !s.stepA.items || s.stepA.items.length === 0) return null;
  const items = s.stepA.items;
  const rate = Number(s.stepA?.exchangeRate) || 0;

  const shippingCost = Number(s.stepD?.shippingCost) || 0;
  const customs = Number(s.stepD?.customs) || 0;
  const vat = Number(s.stepD?.vat) || 0;
  const tpiToNim = s.stepC?.carrier === 'TPI' ? (Number(s.stepD?.tpiToNim) || 0) : 0;
  const nim = Number(s.stepE?.nimExpressCost) || 0;
  const totalExtra = shippingCost + customs + vat + tpiToNim + nim;

  const itemValByMethod = (it, m) => {
    if (m === 'volume') return Number(it.volume) || 0;
    if (m === 'weight') return Number(it.weight) || 0;
    if (m === 'boxes')  return Number(it.boxes) || 0;
    if (m === 'yuan')   return Number(it.yuanAmount) || 0;
    return 0;
  };
  const sumByMethod = m => items.reduce((sum, it) => sum + itemValByMethod(it, m), 0);

  const chosen = s.allocMethod || 'volume';
  let effective = chosen;
  if (sumByMethod(effective) <= 0) {
    effective = ['boxes', 'yuan', 'weight', 'volume'].find(m => sumByMethod(m) > 0) || chosen;
  }
  const totalShare = sumByMethod(effective);

  const perItem = items.map(it => {
    // Backward-compat: derive boxes/perBox if old shape with quantity
    const boxes = it.boxes != null ? Number(it.boxes) : 1;
    const perBox = it.perBox != null ? Number(it.perBox) : Number(it.quantity || 0);
    const totalPieces = boxes * perBox;
    const yuan = Number(it.yuanAmount) || 0;
    const baht = yuan * rate;
    let share = 0;
    if (items.length === 1) share = 1;
    else if (totalShare > 0) share = itemValByMethod(it, effective) / totalShare;
    const allocExtra = totalExtra * share;
    const totalCost = baht + allocExtra;
    const perUnit = totalPieces > 0 ? totalCost / totalPieces : 0;
    return {
      name: it.name || it.sku || '-',
      sku: it.sku,
      boxes, perBox, totalPieces,
      yuan, baht,
      weight: Number(it.weight) || 0,
      volume: Number(it.volume) || 0,
      share, allocExtra, totalCost, perUnit
    };
  });

  const totalYuan = sumByMethod('yuan');
  const totalProduct = totalYuan * rate;
  const totalBoxes = sumByMethod('boxes');
  const totalWeight = sumByMethod('weight');
  const totalVolume = sumByMethod('volume');
  const totalPieces = perItem.reduce((s, p) => s + p.totalPieces, 0);

  return {
    perItem, totalProduct, totalExtra,
    totalYuan, totalBoxes, totalWeight, totalVolume, totalPieces,
    shippingCost, customs, vat, tpiToNim, nim, rate,
    grandTotal: totalProduct + totalExtra,
    allocMethod: chosen,
    effectiveAlloc: effective,
    allocFellBack: effective !== chosen
  };
}

/* ============ Toast / Modal ============ */
let toastTimer;
function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.className = 'toast show ' + type;
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast ' + type, 2200);
}
function confirmModal(title, message, onYes, yesText = 'ยืนยัน', yesClass = 'btn-primary') {
  const bd = document.getElementById('modal-backdrop');
  const mc = document.getElementById('modal-content');
  mc.innerHTML = `
    <h3>${escapeHtml(title)}</h3>
    <p>${escapeHtml(message)}</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel">ยกเลิก</button>
      <button class="btn ${yesClass}" id="modal-yes">${escapeHtml(yesText)}</button>
    </div>`;
  bd.classList.add('show');
  document.getElementById('modal-cancel').onclick = () => bd.classList.remove('show');
  document.getElementById('modal-yes').onclick = () => {
    bd.classList.remove('show');
    onYes();
  };
}

/* ============ Image processing ============ */
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function compressImage(file, maxDim = 1024, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = h * (maxDim / w); w = maxDim; }
        else if (h > maxDim) { w = w * (maxDim / h); h = maxDim; }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// state ระหว่างกรอกฟอร์ม: { category: [{fileId, url, viewUrl, thumbUrl, name, uploadedAt, category}] }
let tempPhotosByCategory = {};

function loadTempPhotos(stepData) {
  tempPhotosByCategory = {};
  (stepData?.photos || []).forEach(p => {
    if (!p || !p.fileId) return;  // ข้าม legacy base64 — ใช้เฉพาะรูปที่ขึ้น Drive แล้ว
    const k = p.category || 'general';
    (tempPhotosByCategory[k] = tempPhotosByCategory[k] || []).push(p);
  });

function collectStepPhotos() {
  const out = [];
  Object.entries(tempPhotosByCategory).forEach(([cat, list]) => {
    list.forEach(p => out.push(Object.assign({}, p, { category: cat })));
  });
  return out;
}

async function uploadPhotoToCloud(dataUrl, shipmentId, containerNo, step, category) {
  return await cloudCall('uploadPhoto', { payload: { shipmentId, containerNo, step, category, dataUrl } });
}

function isPdfAttachment(p) {
  if (!p) return false;
  if (p.mimeType === 'application/pdf') return true;
  if (typeof p.name === 'string' && /\.pdf$/i.test(p.name)) return true;
  if (typeof p.url === 'string' && p.url.indexOf('data:application/pdf') === 0) return true;
  return false;
}

function renderPhotoCategoryGrid(catKey) {
  const list = tempPhotosByCategory[catKey] || [];
  return list.map((p, i) => {
    const preview = isPdfAttachment(p)
      ? `<div class="pdf-thumb">📄<span class="pdf-label">PDF</span></div>`
      : `<img src="${p.thumbUrl || p.url}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.opacity='0.3'">`;
    return `
      <div class="photo-thumb">
        ${preview}
        <a class="view-photo" href="${p.viewUrl || p.url}" target="_blank" rel="noopener" title="${isPdfAttachment(p) ? 'เปิดดู PDF' : 'เปิดดูภาพ'}">↗</a>
        <button class="delete-photo" onclick="removeCloudPhoto('${catKey}', ${i})">×</button>
      </div>
    `;
  }).join('');
}

async function uploadStepPhotos(input, step, catKey) {
  if (!cloudEnabled()) { toast('ต้องตั้งค่า Cloud sync ก่อน', 'error'); input.value = ''; return; }
  if (!isOnline()) { toast('ต้องออนไลน์เพื่ออัปโหลดรูป', 'error'); input.value = ''; return; }
  const s = getShipment(state.currentId);
  const shipmentId = state.currentId;
  const containerNo = s?.containerNo || s?.id || shipmentId;
  if (!shipmentId || !containerNo) { toast('ต้องบันทึก Shipment ก่อนถึงอัปโหลดรูปได้', 'error'); input.value = ''; return; }
  const files = [...input.files];
  input.value = '';
  const gridEl = document.getElementById('grid-' + catKey);
  for (const f of files) {
    let placeholder;
    if (gridEl) {
      placeholder = document.createElement('div');
      placeholder.className = 'photo-uploading';
      placeholder.textContent = '⏳';
      gridEl.appendChild(placeholder);
    }
    try {
      const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      const data = isPdf ? await readFileAsDataURL(f) : await compressImage(f);
      const meta = await uploadPhotoToCloud(data, shipmentId, containerNo, step, catKey);
      const list = (tempPhotosByCategory[catKey] = tempPhotosByCategory[catKey] || []);
      list.push(Object.assign({ category: catKey }, meta));
    } catch (e) {
      console.error(e);
      toast('อัปโหลดล้มเหลว: ' + (e.message || e), 'error');
    } finally {
      if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
    }
  }
  refreshCategoryGrid(catKey);
}

function removeCloudPhoto(catKey, idx) {
  const list = tempPhotosByCategory[catKey];
  if (!list || !list[idx]) return;
  const removed = list.splice(idx, 1)[0];
  refreshCategoryGrid(catKey);
  if (removed?.fileId && cloudEnabled() && isOnline()) {
    cloudCall('deletePhoto', { payload: { fileId: removed.fileId } }).catch(() => {});
  }
}

function renderPhotosViewerForStep(stepData) {
  const photos = (stepData?.photos || []).filter(p => p && (p.fileId || typeof p === 'string'));
  if (photos.length === 0) return '';
  const byCat = {};
  photos.forEach(p => {
    if (typeof p === 'string') {
      (byCat['legacy'] = byCat['legacy'] || []).push({ url: p, viewUrl: p, thumbUrl: p, name: 'legacy' });
    } else {
      const k = p.category || 'general';
      (byCat[k] = byCat[k] || []).push(p);
    }
  });
  return Object.entries(byCat).map(([catKey, list]) => {
    const info = PHOTO_CAT_INFO[catKey] || { icon: catKey === 'legacy' ? '🗂️' : '📎', label: catKey === 'legacy' ? 'รูปเดิม' : catKey };
    return `
      <div style="margin-top:10px">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">${info.icon} ${escapeHtml(info.label)} · ${list.length} รูป</div>
        <div class="photo-grid">
          ${list.map(p => {
            const isPdf = isPdfAttachment(p);
            const preview = isPdf
              ? `<div class="pdf-thumb">📄<span class="pdf-label">PDF</span></div>`
              : `<img src="${p.thumbUrl || p.url}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.opacity='0.3'">`;
            return `
            <a class="photo-thumb" href="${p.viewUrl || p.url}" target="_blank" rel="noopener" title="${isPdf ? 'เปิดดู PDF' : 'ดูภาพเต็ม'}">
              ${preview}
              <span class="view-photo" style="pointer-events:none">↗</span>
            </a>`;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

/* ============ Renderer ============ */
function renderTopbar(title, showBack = true, extras = '') {
  const t = document.getElementById('topbar');
  const modeName = state.mode === 'owner' ? 'เจ้าของ' : (state.mode === 'staff' ? 'พนักงาน' : (state.mode === 'cards' ? 'Card' : ''));
  t.innerHTML = `
    ${showBack ? `<button class="back-btn" onclick="back()">←</button>` : `<div style="width:8px"></div>`}
    <h1>${escapeHtml(title)}</h1>
    ${state.mode ? `<button class="switch-btn" onclick="switchMode()">${modeName} ↻</button>` : ''}
    ${extras}
  `;
}

function renderBottomBar(html) {
  const b = document.getElementById('bottom-bar');
  if (!html) { b.innerHTML = ''; b.style.display = 'none'; return; }
  b.innerHTML = `<div class="bottom-bar">${html}</div>`;
  b.style.display = 'block';
}

function back() {
  if (state.view === 'owner-dashboard' || state.view === 'staff-dashboard' || state.view === 'cards-dashboard') {
    state.mode = null;
    state.view = null;
    render();
  } else if (state.view && state.view.startsWith('owner-')) {
    state.view = 'owner-dashboard';
    state.currentId = null;
    render();
  } else if (state.view && state.view.startsWith('staff-')) {
    state.view = 'staff-dashboard';
    state.currentId = null;
    render();
  } else if (state.view && state.view.startsWith('cards-')) {
    state.view = 'cards-dashboard';
    state.currentCardId = null;
    render();
  } else {
    state.view = null;
    state.mode = null;
    render();
  }
}

function switchMode() {
  confirmModal('สลับโหมด', 'ต้องการกลับไปหน้าเลือกโหมดหรือไม่?', () => {
    state.mode = null;
    state.view = null;
    state.currentId = null;
    render();
  }, 'ใช่', 'btn-primary');
}

function render() {
  const main = document.getElementById('main');
  if (!state.mode) return renderModeSelect();
  if (state.mode === 'owner') {
    if (!state.view || state.view === 'owner-dashboard') return renderOwnerDashboard();
    if (state.view === 'owner-new') return renderOwnerNew();
    if (state.view === 'owner-detail') return renderOwnerDetail();
    if (state.view === 'owner-step-a') return renderStepA();
    if (state.view === 'owner-step-b') return renderStepB();
    if (state.view === 'owner-step-c') return renderStepC();
    if (state.view === 'owner-step-d') return renderStepD();
    if (state.view === 'owner-step-e') return renderStepE();
  }
  if (state.mode === 'staff') {
    if (!state.view || state.view === 'staff-dashboard') return renderStaffDashboard();
    if (state.view === 'staff-detail') return renderStaffDetail();
    if (state.view === 'staff-step-e') return renderStepE();
  }
  if (state.mode === 'cards') {
    if (!state.view || state.view === 'cards-dashboard') return renderCardList();
    if (state.view === 'cards-form') return renderCardForm(state.currentCardId);
  }
}

/* ============ Searchable combobox (free text + SKU helper) ============ */
function initCombo(combo) {
  const input = combo.querySelector('.combo-input');
  const hidden = combo.querySelector('.item-sku');
  const dropdown = combo.querySelector('.combo-dropdown');

  function showDropdown(query = '') {
    const q = query.trim().toLowerCase();
    let results = SKU_DATA;
    if (q) {
      results = SKU_DATA.filter(s =>
        s.sku.toLowerCase().includes(q) ||
        (s.name && s.name.toLowerCase().includes(q))
      );
    }
    if (results.length === 0) {
      dropdown.innerHTML = '<div class="combo-empty">ไม่พบ SKU ที่ตรงกัน — กดออกเพื่อใช้ข้อความที่พิมพ์</div>';
    } else {
      dropdown.innerHTML = results.slice(0, 100).map(s => {
        const skuHl = q ? highlightMatch(s.sku, q) : escapeHtml(s.sku);
        const nameHl = q ? highlightMatch(s.name, q) : escapeHtml(s.name || '');
        return `<div class="combo-option" data-sku="${escapeHtml(s.sku)}" data-name="${escapeHtml(s.name || '')}">
          <div class="opt-sku">${skuHl}</div>
          ${s.name ? `<div class="opt-name">${nameHl}</div>` : ''}
        </div>`;
      }).join('');
      [...dropdown.querySelectorAll('.combo-option')].forEach(opt => {
        opt.addEventListener('mousedown', e => {
          e.preventDefault();
          comboSetValue(combo, opt.dataset.sku, opt.dataset.name);
          dropdown.classList.remove('show');
        });
      });
    }
    dropdown.classList.add('show');
  }

  input.addEventListener('focus', () => showDropdown(input.value));
  input.addEventListener('input', () => {
    hidden.value = '';
    if (input.value.trim()) combo.classList.add('has-value');
    else combo.classList.remove('has-value');
    showDropdown(input.value);
  });
  input.addEventListener('blur', () => {
    setTimeout(() => { dropdown.classList.remove('show'); }, 180);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { dropdown.classList.remove('show'); input.blur(); }
  });
}
function highlightMatch(text, q) {
  if (!text) return '';
  const safe = escapeHtml(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return safe.replace(re, '<mark>$1</mark>');
}
function comboSetValue(combo, sku, name) {
  const input = combo.querySelector('.combo-input');
  const hidden = combo.querySelector('.item-sku');
  const displayName = name || SKU_BY_ID[sku] || '';
  hidden.value = sku || '';
  input.value = displayName ? `${sku} — ${displayName}` : (sku || '');
  combo.classList.add('has-value');
}
function comboClear(combo) {
  const input = combo.querySelector('.combo-input');
  const hidden = combo.querySelector('.item-sku');
  hidden.value = '';
  input.value = '';
  combo.classList.remove('has-value');
  input.focus();
}
function removeItemRow(idx) {
  const cnt = document.getElementById('items-container');
  if (cnt.children.length <= 1) { toast('ต้องมีอย่างน้อย 1 รายการ', 'error'); return; }
  const el = cnt.querySelector(`[data-idx="${idx}"]`);
  if (el) el.remove();
  [...cnt.children].forEach((c,i) => c.querySelector('.item-num').textContent = `รายการ #${i+1}`);
}
function collectItems() {
  const rows = [...document.getElementById('items-container').children];
  const items = [];
  for (const r of rows) {
    const factory = r.querySelector('.item-factory').value.trim();
    const name = r.querySelector('.item-name').value.trim();
    const sku = r.querySelector('.item-sku').value.trim();
    const boxes = parseFloat(r.querySelector('.item-boxes').value);
    const perBox = parseFloat(r.querySelector('.item-perbox').value);
    const yuan = parseFloat(r.querySelector('.item-yuan').value);
    const weight = parseFloat(r.querySelector('.item-weight').value);
    const volume = parseFloat(r.querySelector('.item-volume').value);
    if (!factory) { toast('กรุณากรอกโรงงานทุกรายการ', 'error'); return null; }
    if (!name) { toast('กรุณากรอกชื่อกลุ่มสินค้าทุกรายการ', 'error'); return null; }
    if (!boxes || boxes <= 0) { toast('กรุณากรอกจำนวนลังให้ครบ', 'error'); return null; }
    if (!perBox || perBox <= 0) { toast('กรุณากรอกจำนวนชิ้น/ลังให้ครบ', 'error'); return null; }
    if (isNaN(yuan) || yuan < 0) { toast('กรุณากรอกราคารวม (หยวน)', 'error'); return null; }
    items.push({
      factory,
      name, sku: sku || null,
      boxes, perBox,
      yuanAmount: yuan,
      weight: isNaN(weight) ? null : weight,
      volume: isNaN(volume) ? null : volume
    });
  }
  return items;
}
function saveNewShipment() {
  const id = document.getElementById('newId').value.trim().toUpperCase();
  const orderDate = document.getElementById('orderDate').value;
  const exchangeRate = parseFloat(document.getElementById('exchangeRate').value);
  const allocMethod = (document.querySelector('input[name="allocMethod"]:checked') || {}).value;
  if (!id) { toast('กรุณากรอกหมายเลขตู้ (Container No.)', 'error'); return; }
  if (!/^[A-Z0-9._\-]+$/i.test(id)) { toast('Container No. รองรับเฉพาะตัวอักษร/ตัวเลข/._-', 'error'); return; }
  if (!orderDate) { toast('กรุณาเลือกวันที่สั่งซื้อ', 'error'); return; }
  if (!exchangeRate || exchangeRate <= 0) { toast('กรุณากรอกอัตราแลกเปลี่ยน', 'error'); return; }
  if (!allocMethod) { toast('กรุณาเลือกวิธีแบ่งค่าขนส่ง', 'error'); return; }
  const items = collectItems();
  if (!items) return;

  const all = loadShipments();
  if (all.some(s => s.id === id)) { toast('หมายเลขตู้นี้มีอยู่แล้ว', 'error'); return; }
  const now = new Date().toISOString();
  const ship = {
    id, containerNo: id, createdAt: now, updatedAt: now,
    allocMethod,
    stepA: { orderDate, exchangeRate, items, completed: true },
    stepB: null, stepC: null, stepD: null, stepE: null,
    confirmed: false
  };
  all.push(ship);
  if (!saveShipments(all)) return;
  cloudPush(ship);
  toast('บันทึก Shipment เรียบร้อย ✓', 'success');
  state.currentId = id;
  state.view = 'owner-detail';
  render();
}

function renderStepCard(num, title, completed, body, targetView, isCurrent = false) {
  const cls = completed ? 'completed' : (isCurrent ? 'current' : '');
  const action = targetView ? `<button class="step-action" onclick="event.stopPropagation();gotoStep('${targetView}')">${completed ? 'แก้ไข' : 'บันทึก'}</button>` : '';
  return `
    <div class="step-card ${cls}">
      <div class="step-header">
        <div class="step-num">${completed ? '✓' : num}</div>
        <div class="step-title">
          <div class="title">${title}</div>
          <div class="subtitle">Step ${num}</div>
        </div>
        ${action}
      </div>
      <div class="step-body">${body}</div>
    </div>
  `;
}
function gotoStep(view) { state.view = view; render(); }

function renderCostSummary(costs, s) {
  let html = `
    <div class="cost-summary">
      <h3>💰 สรุปต้นทุน</h3>
      <div class="cost-row"><span>ค่าสินค้ารวม (¥${fmtBaht(costs.totalYuan)} × ${costs.rate ? costs.rate.toFixed(4) : '-'})</span><span>${fmtBaht(costs.totalProduct)} ฿</span></div>
      ${costs.shippingCost ? `<div class="cost-row"><span>ค่าขนส่งจีน-ไทย</span><span>${fmtBaht(costs.shippingCost)} ฿</span></div>` : ''}
      ${costs.customs ? `<div class="cost-row"><span>ค่าศุลกากร</span><span>${fmtBaht(costs.customs)} ฿</span></div>` : ''}
      ${costs.vat ? `<div class="cost-row"><span>VAT</span><span>${fmtBaht(costs.vat)} ฿</span></div>` : ''}
      ${costs.tpiToNim ? `<div class="cost-row"><span>ค่าส่ง TPI → นิ่มซี่เส็ง</span><span>${fmtBaht(costs.tpiToNim)} ฿</span></div>` : ''}
      ${costs.nim ? `<div class="cost-row"><span>Nim Express</span><span>${fmtBaht(costs.nim)} ฿</span></div>` : ''}
      <div class="cost-row total divider"><span>รวมทั้งหมด</span><span>${fmtBaht(costs.grandTotal)} ฿</span></div>
    </div>
  `;
  if (costs.perItem.length > 0) {
    const methodLabel = ALLOC_LABEL[costs.effectiveAlloc] || '-';
    const fellBack = costs.allocFellBack
      ? ` <span style="color:var(--warning);font-weight:400">(ข้อมูล${ALLOC_LABEL[costs.allocMethod]}ไม่ครบ — fallback)</span>`
      : '';
    html += `<div class="section-header"><h2>ต้นทุนต่อชิ้น · ${methodLabel}${fellBack}</h2></div>`;
    html += costs.perItem.map(it => `
      <div class="cost-sku-card">
        <div class="sku-name">${escapeHtml(it.name)}</div>
        ${it.sku && it.sku !== it.name ? `<div style="font-size:11px;color:var(--text-muted);margin-top:-4px;margin-bottom:6px">SKU: ${escapeHtml(it.sku)}</div>` : ''}
        <div class="cost-detail"><span>จำนวน</span><span>${fmtNum(it.boxes)} ลัง × ${fmtNum(it.perBox)} = ${fmtNum(it.totalPieces)} ชิ้น</span></div>
        ${it.weight ? `<div class="cost-detail"><span>น้ำหนัก</span><span>${fmtNum(it.weight)} กก.</span></div>` : ''}
        ${it.volume ? `<div class="cost-detail"><span>ปริมาตร</span><span>${fmtNum(it.volume)} คิว</span></div>` : ''}
        <div class="cost-detail"><span>ค่าสินค้า (¥${fmtBaht(it.yuan)})</span><span>${fmtBaht(it.baht)} ฿</span></div>
        <div class="cost-detail"><span>ค่าขนส่ง+อื่นๆ (${(it.share*100).toFixed(1)}%)</span><span>${fmtBaht(it.allocExtra)} ฿</span></div>
        <div class="cost-detail"><span>รวม</span><span>${fmtBaht(it.totalCost)} ฿</span></div>
        <div class="cost-per-unit">
          <span class="label">ต้นทุน/ชิ้น</span>
          <span class="value">${fmtBaht(it.perUnit)} ฿</span>
        </div>
      </div>
    `).join('');
  }
  return html;
}

          </label>
          <label class="radio-card ${c.transportMode === 'sea' ? 'selected' : ''}" id="r-sea" onclick="selectTransportMode('sea')">

            🚢 ทางเรือ
            <div style="font-size:11px;color:var(--text-muted);font-weight:400;margin-top:2px">6,000 ฿/คิว</div>
          </label>
        </div>
        <div class="field-hint">ค่าขนส่งคำนวณ = ปริมาตร × อัตรา (ขั้นต่ำ 500 ฿)</div>

}
function selectCarrier(c) {
  document.getElementById('r-TPI').classList.toggle('selected', c === 'TPI');
  document.getElementById('r-NEXT').classList.toggle('selected', c === 'NEXT');
  document.querySelector(`input[name="carrier"][value="${c}"]`).checked = true;
  const tpiField = document.getElementById('tpi-mode-field');
  if (tpiField) tpiField.style.display = c === 'TPI' ? 'block' : 'none';
}
function selectTransportMode(m) {
  document.getElementById('r-land').classList.toggle('selected', m === 'land');
  document.getElementById('r-sea').classList.toggle('selected', m === 'sea');
  const r = document.querySelector(`input[name="transportMode"][value="${m}"]`);
  if (r) r.checked = true;
}
function saveStepC() {
  const weight = parseFloat(document.getElementById('weight').value);
  const boxes = parseInt(document.getElementById('boxes').value, 10);
  const volume = parseFloat(document.getElementById('volume').value);
  const carrierEl = document.querySelector('input[name="carrier"]:checked');
  const transportEl = document.querySelector('input[name="transportMode"]:checked');
  if (!weight || weight <= 0) { toast('กรุณากรอกน้ำหนัก', 'error'); return; }
  if (!boxes || boxes <= 0) { toast('กรุณากรอกจำนวนกล่อง', 'error'); return; }
  if (!carrierEl) { toast('กรุณาเลือกขนส่ง', 'error'); return; }
  if (carrierEl.value === 'TPI' && !transportEl) { toast('กรุณาเลือกทางรถหรือทางเรือ', 'error'); return; }
  const photos = collectStepPhotos();
  if (!updateShipment(state.currentId, s => ({
    ...s, stepC: {
      weight, boxes, volume: isNaN(volume) ? null : volume,
      carrier: carrierEl.value,
      transportMode: carrierEl.value === 'TPI' ? transportEl.value : null,
      photos,
      completed: true
    }
  }))) return;
  toast('บันทึกเรียบร้อย ✓', 'success');
  state.view = 'owner-detail';
  render();
}

/* ============ Step D ============ */
const TPI_RATE = { land: 8000, sea: 6000 };
const TPI_MIN = 500;
const TPI_TO_NIM_BASE = 100;

function calcTpiShipping(volume, mode) {
  const v = Number(volume) || 0;
  const rate = TPI_RATE[mode] || 0;
  if (!v || !rate) return 0;
  return Math.max(TPI_MIN, v * rate);
}

function renderStepD() {
  const s = getShipment(state.currentId);
  if (!s) { back(); return; }
  renderTopbar('Step D: ถึงไทย');
  loadTempPhotos(s.stepD);
  const d = s.stepD || {};
  const isNext = s.stepC?.carrier === 'NEXT';
  const volume = Number(s.stepC?.volume) || 0;
  const mode = s.stepC?.transportMode;
  const autoTpiCost = !isNext ? calcTpiShipping(volume, mode) : 0;
  const initialShipping = d.shippingCost ?? (!isNext ? autoTpiCost : '');
  const groupSize = d.arrivalGroupSize ?? 1;
  const initialTpiToNim = d.tpiToNim ?? +(TPI_TO_NIM_BASE / groupSize).toFixed(2);
  document.getElementById('main').innerHTML = `
    <div class="form-section">
      <h3><span class="step-badge">Step D</span> ของถึงไทย</h3>
      <div class="field">
        <label>วันที่ถึงไทย <span class="req">*</span></label>
        <input type="date" id="arrivalDate" value="${d.arrivalDate || todayISO()}">
      </div>
      ${!isNext && mode ? `
        <div class="field-hint" style="padding:10px;background:var(--primary-50);border-radius:8px;color:var(--primary);margin-bottom:10px">
          📐 ปริมาตร <b>${fmtNum(volume)} คิว</b> × ${fmtNum(TPI_RATE[mode])} ฿/คิว (${mode === 'land' ? 'ทางรถ' : 'ทางเรือ'}) = <b>${fmtBaht(volume * TPI_RATE[mode])} ฿</b><br>
          ขั้นต่ำ ${TPI_MIN} ฿ → ค่าขนส่งสุทธิ <b>${fmtBaht(autoTpiCost)} ฿</b>
        </div>
      ` : ''}
      ${!isNext && !mode ? `
        <div class="field-hint" style="padding:10px;background:#fef3c7;border-radius:8px;color:#92400e;margin-bottom:10px">
          ⚠️ ยังไม่ได้เลือก ทางรถ/ทางเรือ ใน Step C — กรอกค่าขนส่งด้วยตนเอง
        </div>
      ` : ''}
      <div class="field">
        <label>ค่าขนส่งจีน-ไทย (฿) <span class="req">*</span></label>
        <input type="number" id="shippingCost" min="0" step="0.01" inputmode="decimal" value="${initialShipping}">
        ${!isNext && mode ? `<div class="field-hint">ค่าเริ่มต้นคำนวณอัตโนมัติ — แก้ไขได้หากต่างจริง</div>` : ''}
      </div>
      ${isNext ? `
        <div class="field">
          <label>ค่าศุลกากร (฿) <span class="req">*</span></label>
          <input type="number" id="customs" min="0" step="0.01" inputmode="decimal" value="${d.customs ?? ''}">
        </div>
        <div class="field">
          <label>ภาษีมูลค่าเพิ่ม VAT (฿) <span class="req">*</span></label>
          <input type="number" id="vat" min="0" step="0.01" inputmode="decimal" value="${d.vat ?? ''}">
        </div>
      ` : `
        <div class="field">
          <label>จำนวนตู้ที่มาพร้อมกัน (รวมตู้นี้) <span class="req">*</span></label>
          <input type="number" id="arrivalGroupSize" min="1" step="1" inputmode="numeric" value="${groupSize}" oninput="recalcTpiToNim()">
          <div class="field-hint">ค่าส่งจาก TPI → นิ่มซี่เส็ง ${TPI_TO_NIM_BASE} ฿ ต่อครั้ง หารตามจำนวนตู้</div>
        </div>
        <div class="field">
          <label>ค่าส่ง TPI → นิ่มซี่เส็ง (฿) <span class="req">*</span></label>
          <input type="number" id="tpiToNim" min="0" step="0.01" inputmode="decimal" value="${initialTpiToNim}">
          <div class="field-hint" id="tpi-nim-hint">${TPI_TO_NIM_BASE} ÷ ${groupSize} = ${fmtBaht(TPI_TO_NIM_BASE / groupSize)} ฿ (แก้ไขได้)</div>
        </div>
        <div class="field-hint" style="padding:10px;background:var(--primary-50);border-radius:8px;color:var(--primary)">ℹ️ ขนส่ง TPI ไม่ต้องบันทึกค่าศุลกากร/VAT</div>
      `}
    </div>
    ${renderStepPhotosBlock('D')}
  `;
  renderBottomBar(`
    <button class="btn btn-secondary" onclick="back()">ยกเลิก</button>
    <button class="btn btn-primary" onclick="saveStepD()">💾 บันทึก</button>
  `);
}
function recalcTpiToNim() {
  const size = Math.max(1, parseInt(document.getElementById('arrivalGroupSize').value, 10) || 1);
  const v = +(TPI_TO_NIM_BASE / size).toFixed(2);
  document.getElementById('tpiToNim').value = v;
  const hint = document.getElementById('tpi-nim-hint');
  if (hint) hint.textContent = `${TPI_TO_NIM_BASE} ÷ ${size} = ${fmtBaht(v)} ฿ (แก้ไขได้)`;
}
function saveStepD() {
  const s = getShipment(state.currentId);
  const isNext = s.stepC?.carrier === 'NEXT';
  const arrivalDate = document.getElementById('arrivalDate').value;
  const shippingCost = parseFloat(document.getElementById('shippingCost').value);
  if (!arrivalDate) { toast('กรุณาเลือกวันถึงไทย', 'error'); return; }
  if (isNaN(shippingCost) || shippingCost < 0) { toast('กรุณากรอกค่าขนส่ง', 'error'); return; }
  let customs = 0, vat = 0, tpiToNim = 0, arrivalGroupSize = 1;
  if (isNext) {
    customs = parseFloat(document.getElementById('customs').value);
    vat = parseFloat(document.getElementById('vat').value);
    if (isNaN(customs)) customs = 0;
    if (isNaN(vat)) vat = 0;
  } else {
    arrivalGroupSize = parseInt(document.getElementById('arrivalGroupSize').value, 10);
    if (!arrivalGroupSize || arrivalGroupSize < 1) { toast('จำนวนตู้ต้องอย่างน้อย 1', 'error'); return; }
    tpiToNim = parseFloat(document.getElementById('tpiToNim').value);
    if (isNaN(tpiToNim) || tpiToNim < 0) tpiToNim = TPI_TO_NIM_BASE / arrivalGroupSize;
  }
  const photos = collectStepPhotos();
  if (!updateShipment(state.currentId, s => ({
    ...s, stepD: { arrivalDate, shippingCost, customs, vat, tpiToNim, arrivalGroupSize, photos, completed: true }
  }))) return;
  toast('บันทึกเรียบร้อย ✓', 'success');
  state.view = 'owner-detail';
  render();
}
